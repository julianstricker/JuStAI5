name: Bug report
description: Something does not work as documented. English or German is fine. / Etwas funktioniert nicht wie dokumentiert.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and setup / Hardware und Aufbau
      description: Computer, operating system, cameras or other devices (model), phone/tablet if used.
  - type: input
    id: version
    attributes:
      label: Version
      description: Git commit or release you installed.
  - type: textarea
    id: logs
    attributes:
      label: Logs / Logzeilen
      description: "`docker compose logs core --tail 100`. Remove passwords, API keys and camera credentials first!"
      render: shell
