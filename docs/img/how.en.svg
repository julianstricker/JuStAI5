<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" role="img" aria-label="How JuStAI5 works" font-family="ui-rounded, 'SF Pro Rounded', Nunito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#3ee8b5"/></linearGradient></defs><rect width="900" height="405" rx="22" fill="#12112e"/><rect x="1" y="1" width="898" height="403" rx="21" fill="none" stroke="#ffffff26"/><rect x="0" y="0" width="900" height="5" rx="2" fill="url(#g)" opacity=".9"/><text x="450" y="40" fill="#ece9ff" font-size="20" font-weight="800" text-anchor="middle">How JuStAI5 works</text><rect x="30" y="70" width="230" height="250" rx="16" fill="#1d1b45" stroke="#3ee8b5" stroke-width="1.5" stroke-dasharray="6 6"/><text x="145" y="98" fill="#3ee8b5" font-size="14" font-weight="700" text-anchor="middle">In every room</text><rect x="50" y="115" width="190" height="48" rx="12" fill="#1d1b45" stroke="#ffffff26" stroke-width="1.5"/><text x="145" y="145" fill="#ece9ff" font-size="14" font-weight="500" text-anchor="middle">Camera with microphone</text><rect x="50" y="177" width="190" height="48" rx="12" fill="#1d1b45" stroke="#ffffff26" stroke-width="1.5"/><text x="145" y="207" fill="#ece9ff" font-size="14" font-weight="500" text-anchor="middle">Speaker or tablet</text><rect x="50" y="239" width="190" height="48" rx="12" fill="#1d1b45" stroke="#ffffff26" stroke-width="1.5"/><text x="145" y="269" fill="#ece9ff" font-size="14" font-weight="500" text-anchor="middle">Any screen</text><rect x="330" y="70" width="300" height="250" rx="16" fill="#221f55" stroke="#7c5cff" stroke-width="2.5"/><text x="480" y="100" fill="#ece9ff" font-size="17" font-weight="800" text-anchor="middle">Your JuStAI5 server</text><text x="480" y="120" fill="#a9a6d6" font-size="12" font-weight="500" text-anchor="middle">runs at home, in your network</text><rect x="348" y="138" width="126" height="72" rx="14" fill="#1d1b45" stroke="#7c5cff" stroke-width="1.5"/><text x="411" y="168" fill="#ece9ff" font-size="15" font-weight="700" text-anchor="middle">Hears</text><text x="411" y="190" fill="#a9a6d6" font-size="11.5" font-weight="500" text-anchor="middle">wakeword, speech</text><rect x="486" y="138" width="126" height="72" rx="14" fill="#1d1b45" stroke="#3ee8b5" stroke-width="1.5"/><text x="549" y="168" fill="#ece9ff" font-size="15" font-weight="700" text-anchor="middle">Sees</text><text x="549" y="190" fill="#a9a6d6" font-size="11.5" font-weight="500" text-anchor="middle">people, pets, objects</text><rect x="348" y="224" width="126" height="72" rx="14" fill="#1d1b45" stroke="#ffb86b" stroke-width="1.5"/><text x="411" y="254" fill="#ece9ff" font-size="15" font-weight="700" text-anchor="middle">Remembers</text><text x="411" y="276" fill="#a9a6d6" font-size="11.5" font-weight="500" text-anchor="middle">facts, habits</text><rect x="486" y="224" width="126" height="72" rx="14" fill="#1d1b45" stroke="#ff7eb6" stroke-width="1.5"/><text x="549" y="254" fill="#ece9ff" font-size="15" font-weight="700" text-anchor="middle">Acts</text><text x="549" y="276" fill="#a9a6d6" font-size="11.5" font-weight="500" text-anchor="middle">plugins, automations</text><rect x="700" y="100" width="170" height="170" rx="16" fill="#1d1b45" stroke="#ffb86b" stroke-width="1.5"/><text x="785" y="140" fill="#ece9ff" font-size="17" font-weight="800" text-anchor="middle">AI model</text><text x="785" y="180" fill="#a9a6d6" font-size="13" font-weight="500" text-anchor="middle">Google Gemini (cloud)</text><text x="785" y="202" fill="#a9a6d6" font-size="13" font-weight="500" text-anchor="middle">or Ollama (local)</text><path d="M262 160 L328 160" stroke="#3ee8b5" stroke-width="2" fill="none"/><path d="M318.9955289764732 155.6503446588877 L328 160 L318.9955289764732 164.3496553411123" stroke="#3ee8b5" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M632 185 L698 185" stroke="#ffb86b" stroke-width="2" fill="none"/><path d="M688.9955289764732 180.6503446588877 L698 185 L688.9955289764732 189.3496553411123" stroke="#ffb86b" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M698 215 L632 215" stroke="#ffb86b" stroke-width="2" fill="none"/><path d="M641.0044710235268 219.3496553411123 L632 215 L641.0044710235268 210.6503446588877" stroke="#ffb86b" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M480 322 V356 H145 V324" stroke="#3ee8b5" stroke-width="2" fill="none" stroke-dasharray="7 6"/><path d="M145 340 L145 322" stroke="#3ee8b5" stroke-width="2" fill="none"/><path d="M140.6503446588877 331.0044710235268 L145 322 L149.3496553411123 331.0044710235268" stroke="#3ee8b5" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="312" y="384" fill="#3ee8b5" font-size="13.5" font-weight="500" text-anchor="middle">The answer plays in the same room, never anywhere else.</text></svg>