<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Three ways to build JuStAI5 further" font-family="ui-rounded, 'SF Pro Rounded', Nunito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#3ee8b5"/></linearGradient></defs><rect width="900" height="350" rx="22" fill="#12112e"/><rect x="1" y="1" width="898" height="348" rx="21" fill="none" stroke="#ffffff26"/><rect x="0" y="0" width="900" height="5" rx="2" fill="url(#g)" opacity=".9"/><text x="450" y="40" fill="#ece9ff" font-size="20" font-weight="800" text-anchor="middle">Three ways to build JuStAI5 further</text><rect x="30" y="70" width="265" height="170" rx="16" fill="#1d1b45" stroke="#3ee8b5" stroke-width="1.5"/><circle cx="66" cy="108" r="18" fill="#3ee8b5"/><text x="66" y="114" fill="#0e0d24" font-size="17" font-weight="800" text-anchor="middle">1</text><rect x="180" y="94" width="100" height="24" rx="12" fill="#3ee8b522" stroke="#3ee8b5"/><text x="230" y="111" fill="#ece9ff" font-size="11.5" font-weight="500" text-anchor="middle">easiest</text><text x="162" y="156" fill="#ece9ff" font-size="17" font-weight="800" text-anchor="middle">Ask JuStAI5</text><text x="162" y="186" fill="#a9a6d6" font-size="12.5" font-weight="500" text-anchor="middle">Tell the assistant what you</text><text x="162" y="206" fill="#a9a6d6" font-size="12.5" font-weight="500" text-anchor="middle">want. It writes the plugin itself.</text><path d="M162 242 L162 276" stroke="#3ee8b5" stroke-width="2" fill="none"/><path d="M166.3496553411123 266.9955289764732 L162 276 L157.6503446588877 266.9955289764732" stroke="#3ee8b5" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="315" y="70" width="265" height="170" rx="16" fill="#1d1b45" stroke="#7c5cff" stroke-width="1.5"/><circle cx="351" cy="108" r="18" fill="#7c5cff"/><text x="351" y="114" fill="#0e0d24" font-size="17" font-weight="800" text-anchor="middle">2</text><rect x="465" y="94" width="100" height="24" rx="12" fill="#7c5cff22" stroke="#7c5cff"/><text x="515" y="111" fill="#ece9ff" font-size="11.5" font-weight="500" text-anchor="middle">most popular</text><text x="447" y="156" fill="#ece9ff" font-size="17" font-weight="800" text-anchor="middle">Build a plugin</text><text x="447" y="186" fill="#a9a6d6" font-size="12.5" font-weight="500" text-anchor="middle">Use a coding assistant. Review,</text><text x="447" y="206" fill="#a9a6d6" font-size="12.5" font-weight="500" text-anchor="middle">test, upload as a zip.</text><path d="M447 242 L447 276" stroke="#7c5cff" stroke-width="2" fill="none"/><path d="M451.3496553411123 266.9955289764732 L447 276 L442.6503446588877 266.9955289764732" stroke="#7c5cff" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="600" y="70" width="265" height="170" rx="16" fill="#1d1b45" stroke="#ffb86b" stroke-width="1.5"/><circle cx="636" cy="108" r="18" fill="#ffb86b"/><text x="636" y="114" fill="#0e0d24" font-size="17" font-weight="800" text-anchor="middle">3</text><rect x="750" y="94" width="100" height="24" rx="12" fill="#ffb86b22" stroke="#ffb86b"/><text x="800" y="111" fill="#ece9ff" font-size="11.5" font-weight="500" text-anchor="middle">for tinkerers</text><text x="732" y="156" fill="#ece9ff" font-size="17" font-weight="800" text-anchor="middle">Change the core</text><text x="732" y="186" fill="#a9a6d6" font-size="12.5" font-weight="500" text-anchor="middle">Fork, change in small steps,</text><text x="732" y="206" fill="#a9a6d6" font-size="12.5" font-weight="500" text-anchor="middle">open a pull request.</text><path d="M732 242 L732 276" stroke="#ffb86b" stroke-width="2" fill="none"/><path d="M736.3496553411123 266.9955289764732 L732 276 L727.6503446588877 266.9955289764732" stroke="#ffb86b" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="200" y="280" width="500" height="50" rx="25" fill="#1a2a3d" stroke="#3ee8b5" stroke-width="1.5"/><text x="450" y="311" fill="#ece9ff" font-size="15" font-weight="700" text-anchor="middle">🌍 Share it: plugin zip or pull request</text></svg>