# Complete example plugin for the JuStAI5 SDK (see docs/PLUGINS.md).
# It is *untrusted* on purpose: it runs isolated in the sandbox container and can
# only reach the hosts listed in network_allowlist (through the core gateway).
id: example-weather
name: Wetter (Beispiel-Plugin)
version: 1.0.0
description: >-
  Aktuelles Wetter und Vorhersage über Open-Meteo (ohne API-Schlüssel). Beispiel für
  Manifest, Konfiguration, Berechtigungen, Lifecycle-Hooks, Caching, Fehlerbehandlung,
  Display-Komponente und Tests.
author: JuStAI5
license: MIT
homepage: https://open-meteo.com
types: [tool, integration]
api: ">=1.0,<2.0"
entrypoint: plugin:WeatherPlugin
trust: untrusted          # -> runs in the sandbox
default_enabled: true
provides: ["tool:weather.current", "tool:weather.forecast"]
permissions: [tools.provide, network.http, storage.plugin, display.write]
network_allowlist: [api.open-meteo.com, geocoding-api.open-meteo.com]
config_schema:
  type: object
  properties:
    default_location:
      type: string
      default: Bozen
      description: Ort, wenn keiner genannt wird
    cache_minutes:
      type: integer
      default: 15
      minimum: 0
      maximum: 180
    language:
      type: string
      default: de
      enum: [de, it, en]
  additionalProperties: false
requirements:
  memory_mb: 128
