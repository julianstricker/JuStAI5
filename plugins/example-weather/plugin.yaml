# Complete example plugin for the JuStAI5 SDK (see docs/PLUGINS.md).
# It is *untrusted* on purpose: it runs isolated in the sandbox container and can
# only reach the hosts listed in network_allowlist (through the core gateway).
id: example-weather
name: "Weather (example plugin)"
version: 1.0.0
description: "Current weather and forecast from Open-Meteo (no API key). Example of manifest, configuration, permissions, lifecycle hooks, caching, error handling, display component and tests."
i18n:
  de: {name: "Wetter (Beispiel-Plugin)", description: "Aktuelles Wetter und Vorhersage über Open-Meteo (ohne API-Schlüssel). Beispiel für Manifest, Konfiguration, Berechtigungen, Lifecycle-Hooks, Caching, Fehlerbehandlung, Display-Komponente und Tests."}
  it: {name: "Meteo (plugin di esempio)", description: "Meteo attuale e previsioni da Open-Meteo (senza chiave API). Esempio di manifest, configurazione, permessi, hook del ciclo di vita, cache, gestione degli errori, componente display e test."}
author: JuStAI5
license: MIT
homepage: https://open-meteo.com
types: [tool, integration]
api: ">=1.0,<2.0"
entrypoint: plugin:WeatherPlugin
trust: untrusted          # -> runs in the sandbox
default_enabled: true
provides: ["tool:weather.current", "tool:weather.forecast"]
permissions: [tools.provide, network.http, storage.plugin, display.write]
network_allowlist: [api.open-meteo.com, geocoding-api.open-meteo.com]
config_schema:
  type: object
  properties:
    default_location:
      type: string
      default: Bozen
      description: Place when none is mentioned
    cache_minutes:
      type: integer
      default: 15
      minimum: 0
      maximum: 180
    language:
      type: string
      default: de
      enum: [de, it, en]
  additionalProperties: false
requirements:
  memory_mb: 128
