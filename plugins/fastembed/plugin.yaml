id: fastembed
name: "fastembed (local embeddings)"
version: 1.0.0
description: "Multilingual text embeddings computed locally (ONNX) for the long-term memory."
i18n:
  de: {name: "fastembed (lokale Embeddings)", description: "Mehrsprachige Text-Embeddings lokal (ONNX) für das Langzeitgedächtnis."}
  it: {name: "fastembed (embedding locali)", description: "Embedding di testo multilingue calcolati in locale (ONNX) per la memoria a lungo termine."}
author: JuStAI5
license: Apache-2.0 (fastembed)
types: [embedding]
trust: builtin
entrypoint: plugin:FastEmbedPlugin
default_enabled: true
provides: ["embedding:fastembed"]
permissions: [ai.provide]
config_schema:
  type: object
  properties:
    model:
      type: string
      default: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    cache_dir:
      type: string
      default: ""
      description: Empty = $JUSTAI_MODELS_DIR/fastembed
  additionalProperties: false
