id: faster-whisper
name: "faster-whisper (local speech recognition)"
version: 1.0.0
description: "Local speech-to-text with Whisper (CTranslate2). Multilingual with automatic language detection."
i18n:
  de: {name: "faster-whisper (lokale Spracherkennung)", description: "Lokale Speech-to-Text mit Whisper (CTranslate2). Mehrsprachig mit automatischer Spracherkennung."}
  it: {name: "faster-whisper (riconoscimento vocale locale)", description: "Riconoscimento vocale locale con Whisper (CTranslate2). Multilingue con rilevamento automatico della lingua."}
author: JuStAI5
license: MIT
types: [stt]
trust: builtin
entrypoint: plugin:FasterWhisperPlugin
default_enabled: true
provides: ["stt:faster-whisper"]
permissions: [ai.provide]
config_schema:
  type: object
  properties:
    model:
      type: string
      default: small
      description: tiny, base, small, medium, large-v3, large-v3-turbo or a path
    device:
      type: string
      default: auto
      enum: [auto, cpu, cuda]
    compute_type:
      type: string
      default: int8
    download_root:
      type: string
      default: ""
      description: Empty = $JUSTAI_MODELS_DIR/whisper
    beam_size:
      type: integer
      default: 1
      minimum: 1
      maximum: 5
  additionalProperties: false
requirements:
  memory_mb: 1200
  gpu: optional
