id: gemini
name: "Google Gemini"
version: 1.0.0
description: "Gemini models as LLM (text, images, tools) and as native real-time speech models (Live API). Cloud service."
i18n:
  de: {name: "Google Gemini", description: "Gemini-Modelle als LLM (Text, Bilder, Tools) und als native Echtzeit-Sprachmodelle (Live API). Cloud-Dienst."}
  it: {name: "Google Gemini", description: "Modelli Gemini come LLM (testo, immagini, strumenti) e come modelli vocali nativi in tempo reale (Live API). Servizio cloud."}
author: JuStAI5
license: MIT
types: [ai_provider, realtime_ai]
trust: builtin
entrypoint: plugin:GeminiPlugin
default_enabled: true
provides: ["llm:gemini", "realtime:gemini"]
permissions: [ai.provide]
secret_fields: [api_key]
config_schema:
  type: object
  properties:
    api_key:
      type: string
      description: Gemini API key (https://aistudio.google.com). Alternatively the environment variable GOOGLE_API_KEY.
    default_voice:
      type: string
      default: Kore
      description: Voice for the Live API (e.g. Kore, Puck, Charon, Aoede)
    vad_silence_ms:
      type: integer
      default: 1000
      minimum: 300
      maximum: 3000
  additionalProperties: false
