id: onvif
name: "ONVIF and RTSP cameras, mDNS search"
version: 1.0.0
description: "Generic IP cameras via ONVIF (stream URIs, PTZ, presets) or a direct RTSP URL. Device search via WS-Discovery (unicast probe in authorised ranges) and mDNS (Chromecast/Google TV, AirPlay, Home Assistant)."
i18n:
  de: {name: "ONVIF- und RTSP-Kameras, mDNS-Suche", description: "Generische IP-Kameras über ONVIF (Stream-URIs, PTZ, Presets) oder eine direkte RTSP-URL. Gerätesuche per WS-Discovery (Unicast-Probe in autorisierten Bereichen) und mDNS (Chromecast/Google TV, AirPlay, Home Assistant)."}
  it: {name: "Telecamere ONVIF e RTSP, ricerca mDNS", description: "Telecamere IP generiche tramite ONVIF (URI degli stream, PTZ, preset) o un URL RTSP diretto. Ricerca dispositivi tramite WS-Discovery (probe unicast negli intervalli autorizzati) e mDNS (Chromecast/Google TV, AirPlay, Home Assistant)."}
author: JuStAI5
license: MIT
types: [device, discovery, ptz]
trust: builtin
entrypoint: plugin:OnvifPlugin
default_enabled: true
provides: ["device_driver:onvif", "device_driver:rtsp", "discovery:onvif", "discovery:mdns"]
permissions: [devices.provide, network.lan, network.discovery]
