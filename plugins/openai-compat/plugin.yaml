id: openai-compat
name: "OpenAI-compatible endpoints"
version: 1.0.0
description: "LLMs through the OpenAI-compatible chat API: OpenAI, Ollama, vLLM, llama.cpp server, LM Studio, OpenRouter and others. Each endpoint is registered as its own provider \"oai:<id>\" and marked as local or cloud."
i18n:
  de: {name: "OpenAI-kompatible Endpunkte", description: "LLMs über die OpenAI-kompatible Chat-API: OpenAI, Ollama, vLLM, llama.cpp-Server, LM Studio, OpenRouter u. a. Jeder Endpunkt wird als eigener Provider \"oai:<id>\" registriert und als lokal oder Cloud gekennzeichnet."}
  it: {name: "Endpoint compatibili OpenAI", description: "LLM tramite l'API chat compatibile OpenAI: OpenAI, Ollama, vLLM, server llama.cpp, LM Studio, OpenRouter e altri. Ogni endpoint viene registrato come provider \"oai:<id>\" e contrassegnato come locale o cloud."}
author: JuStAI5
license: MIT
types: [ai_provider, stt, tts]
trust: builtin
entrypoint: plugin:OpenAICompatPlugin
default_enabled: true
provides: ["llm:oai:*", "stt:oai:*", "tts:oai:*"]
permissions: [ai.provide]
secret_fields: [api_keys]
config_schema:
  type: object
  properties:
    endpoints:
      type: array
      default:
        - {id: ollama, name: Ollama (Host), base_url: "http://host.docker.internal:11434/v1", locality: local}
      items:
        type: object
        required: [id, base_url, locality]
        properties:
          id: {type: string, pattern: "^[a-z0-9_-]+$"}
          name: {type: string}
          base_url: {type: string}
          locality: {type: string, enum: [local, cloud]}
          stt: {type: boolean, default: false}
          tts: {type: boolean, default: false}
          supports_tools: {type: boolean, default: true}
    api_keys:
      type: string
      description: 'JSON object {"<endpoint-id>": "<api key>"} (stored encrypted)'
  additionalProperties: false
