id: openwakeword
name: "openWakeWord"
version: 1.0.0
description: "Local wakeword detection with openWakeWord (ONNX). Runs completely offline."
i18n:
  de: {name: "openWakeWord", description: "Lokale Wakeword-Erkennung mit openWakeWord (ONNX). Läuft vollständig offline."}
  it: {name: "openWakeWord", description: "Rilevamento locale della parola di attivazione con openWakeWord (ONNX). Funziona completamente offline."}
author: JuStAI5
license: Apache-2.0 (openWakeWord)
types: [wakeword]
trust: builtin
entrypoint: plugin:OpenWakeWordPlugin
default_enabled: true
provides: ["wakeword:openwakeword"]
permissions: [ai.provide]
config_schema:
  type: object
  properties:
    models_dir:
      type: string
      default: ""
      description: Directory with melspectrogram.onnx, embedding_model.onnx and wakeword models
  additionalProperties: false
requirements:
  memory_mb: 150
