id: piper
name: "Piper (local speech output)"
version: 1.0.0
description: "Fast local text-to-speech with Piper voices (German, Italian, English and many more)."
i18n:
  de: {name: "Piper (lokale Sprachausgabe)", description: "Schnelle lokale Text-to-Speech mit Piper-Stimmen (Deutsch, Italienisch, Englisch u. v. m.)."}
  it: {name: "Piper (sintesi vocale locale)", description: "Sintesi vocale locale veloce con le voci Piper (tedesco, italiano, inglese e molte altre)."}
author: JuStAI5
license: MIT (Plugin), Piper GPL-3.0
types: [tts]
trust: builtin
entrypoint: plugin:PiperPlugin
default_enabled: true
provides: ["tts:piper"]
permissions: [ai.provide]
config_schema:
  type: object
  properties:
    voices_dir:
      type: string
      default: ""
      description: Empty = $JUSTAI_MODELS_DIR/piper
    length_scale:
      type: number
      default: 1.0
      minimum: 0.5
      maximum: 2.0
  additionalProperties: false
