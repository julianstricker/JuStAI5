id: vision-opencv
name: "Local image analysis (OpenCV)"
version: 1.0.0
description: "Object detection with YOLOX (80 COCO classes, e.g. person, dog, cat, car), face detection with YuNet and face features with SFace. Runs locally on the CPU (ONNX Runtime / OpenCV). Models from the OpenCV Model Zoo (Apache-2.0/MIT)."
i18n:
  de: {name: "Lokale Bildanalyse (OpenCV)", description: "Objekterkennung mit YOLOX (80 COCO-Klassen, u. a. Person, Hund, Katze, Auto), Gesichtserkennung mit YuNet und Gesichtsmerkmale mit SFace. Läuft lokal auf der CPU (ONNX Runtime / OpenCV). Modelle aus dem OpenCV Model Zoo (Apache-2.0/MIT)."}
  it: {name: "Analisi locale delle immagini (OpenCV)", description: "Rilevamento oggetti con YOLOX (80 classi COCO, ad es. persona, cane, gatto, auto), rilevamento volti con YuNet e caratteristiche del volto con SFace. Funziona in locale sulla CPU (ONNX Runtime / OpenCV). Modelli dall'OpenCV Model Zoo (Apache-2.0/MIT)."}
author: JuStAI5
license: MIT (Plugin); Modelle Apache-2.0 / MIT
types: [vision, recognition]
trust: builtin
entrypoint: plugin:VisionOpenCVPlugin
default_enabled: true
provides: ["object_detector:yolox", "face_analyzer:opencv-sface"]
permissions: [ai.provide]
config_schema:
  type: object
  properties:
    models_dir:
      type: string
      default: ""
      description: Empty = $JUSTAI_MODELS_DIR/vision
    threads:
      type: integer
      default: 2
      minimum: 1
      maximum: 16
    face_match_threshold:
      type: number
      default: 0.40
      description: Cosine similarity from which a match is plausible (SFace recommends 0.363)
    face_strong_threshold:
      type: number
      default: 0.52
  additionalProperties: false
requirements:
  memory_mb: 400
  gpu: optional
