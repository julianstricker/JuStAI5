[project]
name = "justai-sandbox"
version = "0.1.0"
description = "Isolated runner for untrusted JuStAI5 plugins and generated tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "justai-sdk",
    "httpx>=0.27",
    "pydantic>=2.9",
    "starlette>=0.41",
    "uvicorn>=0.32",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
justai-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justai_sandbox"]
