[project]
name = "justai-sdk"
version = "0.1.0"
description = "Plugin SDK for JuStAI5: manifests, capability ports and tool definitions"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justai_sdk"]
